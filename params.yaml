# params.yaml - Single Source of Truth for FPGA Anti-Tamper Guard with SNN (FSD v2)
# Target: Digilent Nexys A7-100T (Artix-7 xc7a100tcsg324-1)

system:
  clk_freq_hz: 100000000       # clk100: 100 MHz stable oscillator
  clk_core_nom_hz: 25000000    # clk_core: 25 MHz nominal MMCM (DIV=40, VCO=1000MHz)
  baud_rate: 115200            # UART ASCII 115200-8N1
  target_part: xc7a100tcsg324-1

mmcm_drp:
  m_mult: 10                   # VCO = 100 * 10 / 1 = 1000 MHz
  d_div: 1
  div_nominal: 40              # 25.0 MHz
  div_sub_probe: 39            # 25.64 MHz (+2.6%, SCEN2)
  div_overclock: 5             # 200.0 MHz (SCEN1)
  div_slow_probe: 80           # 12.5 MHz

mon_clk:
  wnd_us: 100                  # Evaluation window: 100 us (2500 clk_core cycles @ 25MHz)
  clk_hi_pct: 5                # +5% fast threshold (hard)
  clk_lo_pct: 5                # -5% slow threshold (hard)
  clk_soft_pct: 1              # 1% deviation soft threshold (25 cycles delta)
  stall_cycles: 200            # 2 us @ 100MHz stall watchdog

mon_volt:
  vccint_nominal_code: 1365    # 1.00V nominal (732.4 uV/LSB)
  v_under_code: 1270           # 0.93V under-voltage (hard)
  v_over_code: 1461            # 1.07V over-voltage (hard)
  v_soft_th_code: 12           # 9 mV dip threshold (soft, IIR baseline diff)
  v_soft_step_code: 5          # 4 mV per q-step

victim:
  key_bits: 128
  checksum_good: 0xDEADC0DE
  epoch_cycles: 1024

snn:
  n_neurons: 4
  n_channels: 12
  weight_bits: 8
  membrane_bits: 16
  theta_default: 128
  leak_tick_us: 1000           # 1 ms leak tick
  q_min: 1
  q_max: 15
  m_rule_max: 6                # Leak rule: M <= log2(theta) - 1

neurons_config:
  n0:
    name: "TRANSIENT"
    m_shift: 3
    theta: 128
  n1:
    name: "REPEAT_PROBE"
    m_shift: 4
    theta: 128
  n2:
    name: "COMBINED"
    m_shift: 4
    theta: 128
  n3:
    name: "SPARE"
    m_shift: 4
    theta: 128

escalation:
  esc_th_default: 2            # Alert count >= 2 triggers zeroization
  esc_th_demo: 1               # Instant action for live demo
  arm_default: true
  bypass_default: false
  mode_default: "C"            # Hybrid: clk=REAL, volt=SYNTH
